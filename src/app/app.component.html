<div class="container">
  <div class="main">
    <form
      [formGroup]="searchForm"
      class="searchBar"
      (ngSubmit)="onSearchSubmit()"
    >
      <input
        type="text"
        placeholder="Search..."
        formControlName="searchValue"
        class="searchBarInput"
      />
    </form>
    @if (postsResource.error()) {
      <div class="error">{{ postsResource.error() }}</div>
    }

    @if (postsResource.isLoading()) {
      <div class="status">Loading...</div>
    }

    @if (postsResource.status() === resourceStatus.Resolved) {
      <div class="status">It's resolved</div>
    }

    @for (post of postsResource.value(); track $index) {
      <div>{{ post.title }}</div>
    }

    <button class="btn" (click)="addPost()">Add post</button>
    <button class="btn" (click)="postsResource.reload()">Reload</button>
  </div>
</div>
