<form (submit)="onSubmit($event)">
  @for (question of quizForm.questions; let qi = $index; track qi) {
    <div class="question">
      <input type="text" placeholder="Question name" [field]="question.questionName" />
      <span class="remove" (click)="removeQuestion(qi)">✗</span>

      <div class="answers">
        <div>Answers</div>

        @for (answer of question.answers; let ai = $index; track ai) {
          <div class="answer">
            <input type="text" placeholder="Answer" [field]="answer.text" />
            <span class="remove" (click)="removeAnswer(qi, ai)">✗</span>
          </div>
        }

        <button type="button" (click)="addAnswer(qi)">Add Answer</button>
      </div>
    </div>
  }

  <button type="button" (click)="addQuestion()">Add Question</button>
  <button type="submit">Submit</button>
</form>
